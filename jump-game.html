<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="田野跳跃 —— 一个纯前端 Canvas 横版跳跃游戏 demo">
  <title>田野跳跃 · 横版跳跃 Demo | oli-bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(180deg, #1d2b3a, #0f1722);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #dfe8f2;
      padding: 12px;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.55);
      background: #cfe8f7;
      touch-action: none;
      max-width: 100%;
      display: block;
    }
    .caption { font-size: 14px; opacity: 0.75; }
    .caption kbd {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
    }
    #touch {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    #touch button {
      position: absolute;
      bottom: 28px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 26px;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(2px);
    }
    #touch button:active { background: rgba(255,255,255,0.4); }
    #btn-left  { left: 28px; }
    #btn-right { left: 118px; }
    #btn-jump  { right: 28px; width: 88px; height: 88px; font-size: 32px; }
    @media (pointer: coarse) { #touch { display: block; } }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <div class="caption">
    横版跳跃 Demo · <kbd>←</kbd><kbd>→</kbd> 移动 · <kbd>空格</kbd> 跳跃 · <kbd>R</kbd> 重开
  </div>

  <div id="touch">
    <button id="btn-left" aria-label="向左">◀</button>
    <button id="btn-right" aria-label="向右">▶</button>
    <button id="btn-jump" aria-label="跳跃">⤒</button>
  </div>

  <script src="/assets/js/jump-game.js"></script>
</body>
</html>
