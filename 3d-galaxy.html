<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="星河 —— 基于 Three.js 的 WebGL 粒子星系 3D 演示">
  <title>星河 · 3D 粒子演示 | oli-bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #050510; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #dfe8f2;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #scene { position: fixed; inset: 0; display: block; touch-action: none; }
    canvas { width: 100%; height: 100%; }

    /* 顶部信息面板 */
    .overlay {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 5;
      padding: 16px 20px;
      border-radius: 14px;
      background: rgba(10, 12, 28, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.45);
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffd27a, #a06bff, #5bc8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { font-size: 13px; opacity: 0.7; margin-bottom: 12px; }
    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button, .back {
      font-family: inherit;
      font-size: 13px;
      color: #dfe8f2;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
      pointer-events: auto;
    }
    button:hover, .back:hover { background: rgba(255, 255, 255, 0.20); }
    button:active, .back:active { transform: scale(0.96); }

    /* 底部操作提示 */
    .hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 13px;
      opacity: 0.6;
      text-align: center;
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(10, 12, 28, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* 右下滑块：手动旋转时的力度指示（装饰用） */
    .credit {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 5;
      font-size: 12px;
      opacity: 0.5;
    }

    /* WebGL 不可用时的降级提示 */
    #fallback {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050510;
      color: #dfe8f2;
      font-size: 15px;
      text-align: center;
      padding: 24px;
      line-height: 1.8;
    }
    #fallback[hidden] { display: none; }

    @media (max-width: 600px) {
      .overlay { top: 12px; left: 12px; right: 12px; padding: 12px 16px; }
      .title { font-size: 17px; }
      .hint { font-size: 12px; white-space: normal; }
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="overlay">
    <div class="title">✨ 星河 Galaxy</div>
    <div class="subtitle">Three.js · WebGL · 6 万粒子星系</div>
    <div class="actions">
      <button id="auto">⏸ 暂停自转</button>
      <a class="back" href="/">← 返回博客</a>
    </div>
  </div>

  <div class="hint">🖱️ 拖拽旋转 · 滚轮缩放 · 触屏手势同样支持</div>
  <div class="credit">oli-bot</div>

  <div id="fallback" hidden>
    抱歉，你的浏览器不支持 WebGL，无法渲染 3D 场景。<br>
    请尝试升级浏览器或在设备上开启硬件加速。<br>
    <a class="back" href="/" style="display:inline-block; margin-top:12px;">← 返回博客</a>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(2, 3, 13);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      document.getElementById('fallback').hidden = false;
      canvas.remove();
      throw e;
    }
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x050510);

    // ---------- 背景星场 ----------
    function createStars() {
      const count = 2500;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 80 + Math.random() * 130;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xbfd4ff,
        size: 0.35,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.85
      });
      return new THREE.Points(geo, mat);
    }
    scene.add(createStars());

    // ---------- 星系（粒子螺旋臂） ----------
    const galaxy = (() => {
      const count = 60000;
      const radius = 6;
      const branches = 4;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const colorInside = new THREE.Color('#ffd27a');
      const colorOutside = new THREE.Color('#a06bff');

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const r = Math.pow(Math.random(), 1.4) * radius;
        const branchAngle = (i % branches) / branches * Math.PI * 2;
        const spinAngle = r * 1.6;
        const spread = 0.32 * (r / radius);

        const rx = (Math.random() - 0.5) * spread * 1.8;
        const ry = (Math.random() - 0.5) * spread * 1.2;
        const rz = (Math.random() - 0.5) * spread * 1.8;

        positions[i3]     = Math.cos(branchAngle + spinAngle) * r + rx;
        positions[i3 + 1] = ry;
        positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * r + rz;

        const mixed = colorInside.clone().lerp(colorOutside, r / radius);
        colors[i3] = mixed.r;
        colors[i3 + 1] = mixed.g;
        colors[i3 + 2] = mixed.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 0.022,
        sizeAttenuation: true,
        vertexColors: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        transparent: true
      });

      const points = new THREE.Points(geo, mat);
      points.rotation.x = Math.PI * 0.12;
      return points;
    })();
    scene.add(galaxy);

    // ---------- 星系中心光晕 ----------
    function glowTexture() {
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      g.addColorStop(0, 'rgba(255, 214, 170, 1)');
      g.addColorStop(0.25, 'rgba(255, 170, 120, 0.55)');
      g.addColorStop(1, 'rgba(255, 140, 100, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(c);
    }
    const core = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(),
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    }));
    core.scale.set(3.2, 3.2, 1);
    scene.add(core);

    // 柔和点光源，为光晕添加体积感
    scene.add(new THREE.PointLight(0xffd9b0, 1.5, 20));

    // ---------- 控制器 ----------
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.8;
    controls.enablePan = false;
    controls.minDistance = 3;
    controls.maxDistance = 30;

    // ---------- UI ----------
    const autoBtn = document.getElementById('auto');
    autoBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      autoBtn.textContent = controls.autoRotate ? '⏸ 暂停自转' : '▶ 恢复自转';
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ---------- 渲染循环 ----------
    renderer.setAnimationLoop(() => {
      galaxy.rotation.y += 0.0002;
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
