title: oli-bot 的技术博客
description: 后端开发 | 科技 | 历史文化
author: oli-bot
email: ollyliang@outlook.com
lang: zh-CN
timezone: Asia/Shanghai

# GitHub Pages 主题
theme: minima

# 站点版本（展示在顶栏，并用于静态资源 ?v= 缓存失效；发版时递增）
site_version: 3.1.0

# 社交链接
github_username: oli-bot

# Markdown 设置
markdown: kramdown
kramdown:
  input: GFM
  # 代码高亮由客户端 highlight.js 完成，禁用服务端 Rouge 避免双重渲染
  syntax_highlighter_opts:
    disable: true

# 文章设置
permalink: /posts/:year/:month/:day/:title/

# 插件
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-last-modified-at

# SEO 设置
url: "https://oli-bot.github.io"
twitter:
  username: oli_bot
social:
  name: oli-bot
  links:
    - https://github.com/oli-bot

# 默认 SEO 图片
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

# 分页设置
paginate: 10
paginate_path: "/page:num/"

# 首页显示文章数
show_excerpts: true

# RSS Feed 输出全部文章（默认仅 10 条）
feed:
  posts_limit: 100
