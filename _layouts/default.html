<!DOCTYPE html>
<html lang="{{ site.lang | default: "zh-CN" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    
    <!-- SEO Meta Tags -->
    {% seo %}
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ "/assets/images/favicon.svg" | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/images/favicon-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/images/favicon-16x16.png" | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/images/apple-touch-icon.png" | relative_url }}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    
    <!-- RSS Feed -->
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    
    {% if page.layout == 'post' %}
    <!-- Code Syntax Highlighting -->
    <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-light.min.css">
    <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" disabled>
    {% endif %}
  </head>
  <body>
    <!-- 阅读进度条 -->
    <div class="reading-progress" id="reading-progress">
      <div class="reading-progress-bar" id="reading-progress-bar"></div>
    </div>
    
    <!-- 深色模式切换 -->
    <button id="theme-toggle" title="切换主题" aria-label="切换深色/浅色主题">
      <span class="theme-icon-light">☀️</span>
      <span class="theme-icon-dark">🌙</span>
    </button>
    
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a class="page-link" href="{{ "/" | relative_url }}">首页</a>
          <a class="page-link" href="{{ "/archive/" | relative_url }}">归档</a>
          <a class="page-link" href="{{ "/tags/" | relative_url }}">标签</a>
          <a class="page-link" href="{{ "/projects/" | relative_url }}">项目</a>
          <a class="page-link" href="{{ "/search/" | relative_url }}">搜索</a>
          <a class="page-link" href="{{ "/about/" | relative_url }}">关于</a>
        </nav>
      </div>
    </header>
    
    <main class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
    
    <footer class="site-footer">
      <div class="wrapper">
        <p>&copy; {{ "now" | date: "%Y" }} {{ site.author }} · Powered by <a href="https://pages.github.com">GitHub Pages</a></p>
      </div>
    </footer>
    
    <!-- 图片灯箱容器 -->
    <div class="image-lightbox" id="image-lightbox">
      <span class="lightbox-close">&times;</span>
      <img src="" alt="放大图片">
    </div>
    
    <!-- 功能脚本 -->
    <script>
      (function() {
        // ===== 1. 阅读进度条 =====
        const progressBar = document.getElementById('reading-progress-bar');
        
        function updateReadingProgress() {
          const scrollTop = window.scrollY;
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          const progress = (scrollTop / docHeight) * 100;
          progressBar.style.width = progress + '%';
        }
        
        window.addEventListener('scroll', updateReadingProgress);
        updateReadingProgress();
        
        // ===== 2. 代码复制按钮 =====
        document.querySelectorAll('pre').forEach(pre => {
          const btn = document.createElement('button');
          btn.className = 'copy-code-btn';
          btn.textContent = '复制';
          
          btn.addEventListener('click', async () => {
            const code = pre.querySelector('code')?.textContent || pre.textContent;
            
            try {
              await navigator.clipboard.writeText(code);
              btn.textContent = '已复制!';
              btn.classList.add('copied');
              
              setTimeout(() => {
                btn.textContent = '复制';
                btn.classList.remove('copied');
              }, 2000);
            } catch (err) {
              btn.textContent = '复制失败';
              setTimeout(() => btn.textContent = '复制', 2000);
            }
          });
          
          pre.appendChild(btn);
        });
        
        // ===== 3. 图片灯箱效果 + 懒加载 =====
        const lightbox = document.getElementById('image-lightbox');
        const lightboxImg = lightbox.querySelector('img');
        
        document.querySelectorAll('.post-content img').forEach(img => {
          img.loading = 'lazy';
          img.decoding = 'async';
          img.addEventListener('click', () => {
            lightboxImg.src = img.src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
          });
        });
        
        lightbox.addEventListener('click', () => {
          lightbox.classList.remove('active');
          document.body.style.overflow = '';
        });
        
        // ===== 4. 目录高亮跟随 =====
        const tocLinks = document.querySelectorAll('.toc-content a');
        const headings = document.querySelectorAll('.post-content h2, .post-content h3');
        
        if (tocLinks.length > 0 && headings.length > 0) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const id = entry.target.getAttribute('id');
                tocLinks.forEach(link => {
                  link.classList.remove('active');
                  if (link.getAttribute('href') === '#' + id) {
                    link.classList.add('active');
                  }
                });
              }
            });
          }, { threshold: 0.5 });
          
          headings.forEach(heading => observer.observe(heading));
        }
        
        // ===== 5. 主题切换 =====
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
          html.setAttribute('data-theme', savedTheme);
        }
        
        // 5.1 代码高亮主题跟随切换
        function applyHljsTheme() {
          const light = document.getElementById('hljs-light');
          const dark = document.getElementById('hljs-dark');
          if (!light || !dark) return;
          const isDark = html.getAttribute('data-theme') === 'dark';
          light.disabled = isDark;
          dark.disabled = !isDark;
        }
        
        // 5.2 Giscus 评论主题跟随切换
        function setGiscusTheme() {
          const iframe = document.querySelector('iframe.giscus-frame');
          if (!iframe) return;
          iframe.contentWindow.postMessage({
            giscus: { setConfig: { theme: html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light' } }
          }, 'https://giscus.app');
        }
        
        // giscus iframe 就绪前发送的消息会被丢弃：等它首次回信后再应用主题
        let giscusPending = true;
        window.addEventListener('message', e => {
          if (e.origin === 'https://giscus.app' && e.data && e.data.giscus) {
            if (giscusPending) {
              giscusPending = false;
              setGiscusTheme();
            }
          }
        });
        
        applyHljsTheme();
        
        themeToggle.addEventListener('click', function() {
          const currentTheme = html.getAttribute('data-theme');
          const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
          
          html.setAttribute('data-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          applyHljsTheme();
          giscusPending = true;
          setGiscusTheme();
        });
        
        // ===== 6. GitHub 风格提示块（> [!NOTE] / [!TIP] / [!WARNING] 等） =====
        document.querySelectorAll('.post-content blockquote').forEach(bq => {
          const firstP = bq.querySelector('p:first-child');
          if (!firstP) return;
          const match = firstP.textContent.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
          if (!match) return;
          bq.classList.add('callout', 'callout-' + match[1].toLowerCase());
          firstP.innerHTML = firstP.innerHTML.replace(/^\[!(?:NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i, '');
        });
      })();
    </script>
    
    {% if page.layout == 'post' %}
    <!-- Code Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script>
      document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    </script>
    {% endif %}
  </body>
</html>
